name: Release desktop app

# Push a version tag to build installers and publish a GitHub Release:
#   git tag v0.7.0 && git push origin v0.7.0
# Or run it by hand from the Actions tab to get the installers as artifacts
# without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Tag the current commit as v<package.json version> and publish a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Manual run with publish=true: create the version tag from this branch
  # first, so the build jobs behave exactly like a tag push.
  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "$TAG" -m "$TAG" 2>/dev/null || true
          git push origin "$TAG" || echo "tag $TAG already on origin"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [tag]
    if: always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows installer
          - os: macos-latest
            name: macOS DMG (Intel + Apple Silicon)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v') || needs.tag.result == 'success'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: "!(startsWith(github.ref, 'refs/tags/v') || needs.tag.result == 'success')"
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
